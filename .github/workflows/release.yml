name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: 校验版本（tag / project.godot / site/version.json）
        run: python3 tools/check_version.py --tag "$GITHUB_REF_NAME"
      - name: 编译 C# 工程
        run: dotnet build
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            版本 ${{ github.ref_name }}。
            安装包见本页附件（由维护者上传），或在主菜单点"检测更新"。
